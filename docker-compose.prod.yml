# Production stack.
#
#   cp .env.production.example .env.production   # then fill in the secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The app container serves HTTP directly via FrankenPHP on internal port 8080;
# it is published on ${APP_PORT:-80}. Terminate TLS at your edge proxy.

# Containers that reuse the app image for a long-running command: the app
# container has already migrated, so they only warm their own caches.
x-worker: &worker
  image: atrium-prod
  env_file: .env.production
  environment:
    RUN_MIGRATIONS: "false"
    RUN_OPTIMIZE: "true"
  depends_on:
    app:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      target: app
    image: atrium-prod
    env_file: .env.production
    ports:
      - "${APP_PORT:-80}:8080"
    volumes:
      - storage-app:/app/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Queue workers (Laravel Horizon). No HTTP here, so the image's web
  # healthcheck is replaced by Horizon's own status.
  horizon:
    <<: *worker
    command: php artisan horizon
    volumes:
      - storage-app:/app/storage/app
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Pulse's server card (CPU, memory, disk) needs this long-running check.
  pulse:
    <<: *worker
    command: php artisan pulse:check
    healthcheck:
      disable: true

  # Runs routes/console.php (Horizon snapshots, retention clean-up).
  scheduler:
    <<: *worker
    command: php artisan schedule:work
    volumes:
      - storage-app:/app/storage/app
    healthcheck:
      disable: true

  postgres:
    image: postgres:17-alpine
    # POSTGRES_* values live in .env.production and must match DB_* there.
    env_file: .env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  storage-app:
  postgres-data:
  redis-data:
