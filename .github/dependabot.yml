version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    groups:
      composer-minor:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    groups:
      bun-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - "/docker/dev"
      - "/docker/prod"
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    # A PostgreSQL major version cannot open the previous one's data folder:
    # upgrade it on purpose, with a dump and restore (README "Deploying").
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
