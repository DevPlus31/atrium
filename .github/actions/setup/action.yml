name: Setup Atrium
description: PHP, Bun and Vite+, cached dependencies, an .env with a key, and a migrated SQLite database (Wayfinder reads route-model key types from the schema during asset builds; without it they degrade to string).

inputs:
  coverage:
    description: PHP coverage driver (none, pcov, xdebug)
    default: none
  extensions:
    description: Extra PHP extensions
    default: ''

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.5
        tools: composer:v2
        extensions: ${{ inputs.extensions }}
        coverage: ${{ inputs.coverage }}
        ini-values: zend.assertions=1

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1
      with:
        node-version: 24

    - name: Cache Composer Dependencies
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Cache Bun Dependencies
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - name: Install Dependencies
      shell: bash
      run: |
        composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress
        bun install

    - name: Prepare Application
      shell: bash
      run: |
        cp .env.example .env
        php artisan key:generate
        touch database/database.sqlite
        php artisan migrate --force
