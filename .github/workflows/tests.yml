name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          coverage: pcov

      - name: Build Assets
        run: bun run build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun pm ls 2>/dev/null | grep playwright | head -1 | sed 's/.*@//')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps

      - name: Cache Rector
        uses: actions/cache@v6
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-rector-

      - name: Cache PHPStan
        uses: actions/cache@v6
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-phpstan-

      - name: Create Cache Directories
        run: mkdir -p /tmp/rector /tmp/phpstan

      - name: Tests
        run: composer test

      - name: Store Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots

  # Production runs PostgreSQL; SQLite hides type and collation differences
  # (UUID columns, case-sensitive LIKE), so the suite also runs against it.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: atrium_test
          POSTGRES_USER: atrium
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atrium -d atrium_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The SQLite file the setup migrates only serves the asset build.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          extensions: pdo_pgsql

      - name: Build Assets
        run: bun run build

      - name: Feature and Unit Tests on PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: atrium_test
          DB_USERNAME: atrium
          DB_PASSWORD: secret
        run: php artisan test --compact --parallel --testsuite=Feature,Unit

  # The generators are the downstream entry point: a freshly scaffolded
  # module and aggregate must pass the static gates and its own tests.
  generators:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Scaffold a Module and Aggregate
        run: |
          php artisan make:module Scaffold --no-interaction
          php artisan make:aggregate Scaffold Widget --no-interaction
          composer dump-autoload --optimize
          php artisan migrate --force
          php artisan typescript:transform
          php artisan wayfinder:generate --with-form
          composer lint

      - name: Static Analysis
        run: composer test:types

      - name: Generated Tests
        run: php artisan test --compact app-modules/Scaffold

  # The production stack as deployed: builds the image, starts every service
  # in docker-compose.prod.yml (migrations, permission sync and the caches run
  # in the entrypoint) and waits until /up sees PHP, PostgreSQL and Redis.
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Production Environment
        run: |
          cp .env.production.example .env.production
          sed -i \
            -e "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" \
            -e "s|^PASSKEYS_USER_HANDLE_SECRET=.*|PASSKEYS_USER_HANDLE_SECRET=$(openssl rand -base64 32)|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=ci-secret|" \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-secret|" \
            .env.production

      - name: Build and Start the Stack
        run: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300

      - name: Health Check
        run: |
          curl -fsS -H 'Accept: application/json' http://127.0.0.1:8080/up

      - name: Stack Logs
        if: failure()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color
